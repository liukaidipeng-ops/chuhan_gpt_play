name: One-time P6 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-p6.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verified P6 build delta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ("<script>window.APP_VERSION='2026.10.13-51f5aa';</script>", "<script>window.APP_VERSION='2026.10.14-5f8e13';</script>"),
              ("  let lastDraw = 0, shT = 0;", "  let lastDraw = 0, shT = 0, nextDraw = 0;"),
              ("<script>LD(0.822)</script>", "<script>LD(0.823)</script>"),
              ("<script>LD(0.839)</script>", "<script>LD(0.840)</script>"),
          ]
          old = "      if (calm && t - lastDraw < 64) return;"
          new = old + "\n      // 优化部 P6（Ham 优化部拍板单 p-07 选甲）：有动画时最多 60 帧。高刷屏（iPhone 120 Hz）原来跟着屏幕每秒画 96～120 帧，发烫、掉电快。\n      //   按 1/60 秒的节拍放行（nextDraw 累加，不按上一帧时间），90 Hz 屏也能平均到 60 帧；60 Hz 屏每帧都放行，不受影响\n      if (!calm && t < nextDraw - 2) return;\n      nextDraw = nextDraw + 1000 / 60 < t ? t + 1000 / 60 : nextDraw + 1000 / 60;   // 落后太多（刚从静止/后台回来）就从现在重新起拍"
          replacements.append((old, new))
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected occurrence count for {old[:60]!r}: {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'v': '2026.10.14-5f8e13'}, separators=(',', ':')))
          PY
      - name: Verify exact local-build identity
        run: |
          echo "62dcbd1453d021264089d75574dabb956a866ffa193ad89451ce7ded4fa6d25d  index.html" | sha256sum -c -
          echo "6c2c4e52b77756f03c6cedf49279f40dc160ec329597f658fa64414a113693c2  version.json" | sha256sum -c -
          grep -q "优化部 P6" index.html
          ! grep -q "compactLandscape" index.html
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html version.json "
      - name: Commit release and remove one-time workflow
        run: |
          rm .github/workflows/release-p6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: approved eco animation 60fps cap (source 6582286)"
          git push
